name: FTP Disk Scout

on:
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Find large FTP files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 <<'PY'
          import os
          from ftplib import FTP, error_perm

          host = os.environ["FTP_SERVER"].strip()
          user = os.environ["FTP_USERNAME"].strip()
          password = os.environ["FTP_PASSWORD"]
          base = "/" + (os.environ.get("FTP_SERVER_DIR") or "/").strip("/")

          ftp = FTP()
          ftp.connect(host, 21, timeout=120)
          ftp.login(user, password)
          ftp.set_pasv(True)
          print("login ok pwd=", ftp.pwd(), "base=", base)

          # Show home listing
          for start in ("/", base, "/home", "."):
              try:
                  ftp.cwd(start)
                  print("\n== LIST", ftp.pwd(), "==")
                  ftp.retrlines("LIST")
              except error_perm as e:
                  print("cannot list", start, e)

          found = []

          def walk(path, depth=0, max_depth=4):
              if depth > max_depth:
                  return
              try:
                  ftp.cwd(path)
              except error_perm:
                  return
              pwd = ftp.pwd()
              lines = []
              try:
                  ftp.retrlines("LIST", lines.append)
              except error_perm:
                  return
              for line in lines:
                  parts = line.split(maxsplit=8)
                  if len(parts) < 9:
                      continue
                  name = parts[8]
                  if name in (".", ".."):
                      continue
                  is_dir = line.startswith("d")
                  try:
                      size = int(parts[4])
                  except ValueError:
                      size = 0
                  full = pwd.rstrip("/") + "/" + name
                  if is_dir:
                      walk(full, depth + 1, max_depth)
                  else:
                      found.append((size, full))

          for root in (base, "/"):
              walk(root, 0, 5 if root == base else 2)

          found.sort(reverse=True)
          print("\n== TOP 40 LARGEST FILES ==")
          for size, path in found[:40]:
              print(f"{size:12d}  {path}")
          print("total files scanned", len(found), "bytes", sum(s for s,_ in found))
          ftp.quit()
          PY
