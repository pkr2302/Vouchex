name: Deploy to cPanel

on:
  push:
    branches: [main]
    paths:
      - "VouchEx/laravel-api/**"
      - ".github/workflows/deploy-cpanel.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk and upload built frontend
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 <<'PY'
          import os, sys
          from ftplib import FTP, error_perm
          from pathlib import Path

          host = os.environ["FTP_SERVER"].strip()
          user = os.environ["FTP_USERNAME"].strip()
          password = os.environ["FTP_PASSWORD"]
          base = "/" + (os.environ.get("FTP_SERVER_DIR") or "/").strip("/")

          ftp = FTP()
          ftp.connect(host, 21, timeout=180)
          ftp.login(user, password)
          ftp.set_pasv(True)

          def cwd(path):
              ftp.cwd(path)

          def list_names(path):
              try:
                  cwd(path)
                  return [n for n in ftp.nlst() if n not in (".", "..")]
              except error_perm:
                  return []

          def wipe_files(path):
              names = list_names(path)
              for name in names:
                  leaf = name.rstrip("/").split("/")[-1]
                  try:
                      cwd(path)
                      ftp.delete(leaf)
                      print("DEL", path, leaf)
                  except error_perm as e:
                      print("skip", leaf, e)

          for p in (
              f"{base}/public/assets",
              f"{base}/storage/logs",
              f"{base}/storage/framework/sessions",
              f"{base}/storage/framework/views",
          ):
              wipe_files(p)

          local_public = Path("VouchEx/laravel-api/public")
          assets_dir = local_public / "assets"
          js = sorted(assets_dir.glob("index-*.js"), key=lambda p: p.stat().st_mtime, reverse=True)
          css = sorted(assets_dir.glob("index-*.css"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not js or not css:
              print("MISSING assets")
              sys.exit(1)

          try:
              cwd(f"{base}/public")
              try:
                  ftp.mkd("assets")
              except error_perm:
                  pass
          except error_perm as e:
              print(e)
              sys.exit(1)

          wipe_files(f"{base}/public/assets")
          try:
              cwd(f"{base}/public")
              try:
                  ftp.mkd("assets")
              except error_perm:
                  pass
          except error_perm:
              pass

          for local, remote_dir, remote_name in [
              (local_public / "index.html", f"{base}/public", "index.html"),
              (js[0], f"{base}/public/assets", js[0].name),
              (css[0], f"{base}/public/assets", css[0].name),
          ]:
              cwd(remote_dir)
              print("STOR", remote_name, local.stat().st_size)
              with local.open("rb") as fh:
                  ftp.storbinary(f"STOR {remote_name}", fh, blocksize=64 * 1024)
              print("OK", remote_name)

          ftp.quit()
          print("FRONTEND_OK")
          PY

      - name: Upload laravel-api to cPanel (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./VouchEx/laravel-api/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          timeout: 180000
          exclude: |
            **/.env
            **/.git*
            **/vendor/**
            **/node_modules/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/public/assets/**
            **/public/index.html
            **/.DS_Store
            **/Thumbs.db
            **/app.zip
            **/*.md
