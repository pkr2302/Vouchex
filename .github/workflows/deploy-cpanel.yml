name: Deploy to cPanel

on:
  push:
    branches: [main]
    paths:
      - "VouchEx/laravel-api/**"
      - ".github/workflows/deploy-cpanel.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free cPanel disk space (old assets + logs)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          REMOTE_DIR="${FTP_SERVER_DIR%/}"
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 90;
            set net:max-retries 3;
            set cmd:fail-exit false;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ftp://${FTP_SERVER};
            cd ${REMOTE_DIR}/public/assets;
            glob rm -f index-*.js;
            glob rm -f index-*.css;
            cd ${REMOTE_DIR}/storage/logs;
            glob rm -f *.log;
            glob rm -f laravel-*.log;
            cd ${REMOTE_DIR};
            rm -f error_log;
            rm -f public/error_log;
            rm -f app.zip;
            bye
          "
          echo "Disk cleanup finished (best-effort)."

      - name: Upload laravel-api to cPanel (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./VouchEx/laravel-api/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          timeout: 180000
          exclude: |
            **/.env
            **/.git*
            **/vendor/**
            **/node_modules/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/.DS_Store
            **/Thumbs.db
            **/app.zip
            **/*.md
