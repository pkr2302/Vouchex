name: Deploy to cPanel

on:
  push:
    branches: [main]
    paths:
      - "VouchEx/laravel-api/**"
      - ".github/workflows/deploy-cpanel.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk + upload critical frontend files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 <<'PY'
          import os, sys
          from ftplib import FTP, error_perm
          from pathlib import Path

          host = os.environ["FTP_SERVER"].strip()
          user = os.environ["FTP_USERNAME"].strip()
          password = os.environ["FTP_PASSWORD"]
          base = "/" + (os.environ.get("FTP_SERVER_DIR") or "/").strip("/")

          ftp = FTP()
          ftp.connect(host, 21, timeout=120)
          ftp.login(user, password)
          ftp.set_pasv(True)
          print("pwd", ftp.pwd(), "base", base)

          def cwd(path):
              ftp.cwd(path)

          def nlst():
              try:
                  return [n for n in ftp.nlst() if n not in (".", "..")]
              except error_perm:
                  return []

          def wipe_dir(path, keep=(".gitignore",)):
              try:
                  cwd(path)
              except error_perm as e:
                  print("skip", path, e)
                  return 0
              names = nlst()
              print(f"wipe {ftp.pwd()} names={names}")
              n = 0
              for name in names:
                  leaf = name.rstrip("/").split("/")[-1]
                  if leaf in keep:
                      continue
                  try:
                      ftp.delete(leaf)
                      print("deleted file", leaf)
                      n += 1
                      continue
                  except error_perm:
                      pass
                  try:
                      ftp.rmd(leaf)
                      print("deleted dir", leaf)
                      n += 1
                  except error_perm as e:
                      print("could not remove", leaf, e)
              return n

          removed = 0
          removed += wipe_dir(f"{base}/public/assets", keep=())
          removed += wipe_dir(f"{base}/storage/logs", keep=(".gitignore",))
          removed += wipe_dir(f"{base}/storage/framework/sessions", keep=(".gitignore",))
          removed += wipe_dir(f"{base}/storage/framework/views", keep=(".gitignore",))
          removed += wipe_dir(f"{base}/bootstrap/cache", keep=(".gitignore", "packages.php", "services.php"))

          # Root junk
          for rel in (base, f"{base}/public"):
              try:
                  cwd(rel)
              except error_perm:
                  continue
              for leaf in ("error_log", "app.zip", "debug.log"):
                  try:
                      ftp.delete(leaf)
                      print("deleted", rel, leaf)
                      removed += 1
                  except error_perm:
                      pass

          print("removed", removed)

          # Upload only what we need for the invoice layout (smallest critical set)
          local_public = Path("VouchEx/laravel-api/public")
          uploads = [
              ("index.html", f"{base}/public/index.html"),
              ("assets/index-DPA8upms.js", f"{base}/public/assets/index-DPA8upms.js"),
              ("assets/index-CRkI_dEu.css", f"{base}/public/assets/index-CRkI_dEu.css"),
          ]

          # Ensure assets dir exists
          try:
              cwd(f"{base}/public")
              try:
                  ftp.mkd("assets")
              except error_perm:
                  pass
          except error_perm as e:
              print("cannot enter public", e)
              sys.exit(1)

          for local_rel, remote_path in uploads:
              local = local_public / local_rel
              if not local.exists():
                  print("MISSING local", local)
                  sys.exit(1)
              remote_dir = remote_path.rsplit("/", 1)[0]
              remote_name = remote_path.rsplit("/", 1)[1]
              cwd(remote_dir)
              size = local.stat().st_size
              print(f"upload {local} ({size} bytes) -> {remote_dir}/{remote_name}")
              with local.open("rb") as fh:
                  ftp.storbinary(f"STOR {remote_name}", fh, blocksize=1024 * 64)
              print("ok", remote_name)

          ftp.quit()
          print("CRITICAL FRONTEND UPLOAD COMPLETE")
          PY

      - name: Sync remaining laravel-api files (best effort)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./VouchEx/laravel-api/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          timeout: 180000
          exclude: |
            **/.env
            **/.git*
            **/vendor/**
            **/node_modules/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/public/assets/**
            **/public/index.html
            **/.DS_Store
            **/Thumbs.db
            **/app.zip
            **/*.md
